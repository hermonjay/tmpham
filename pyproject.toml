[project]
name = "analytics-case-study"
version = "0.1.0"
description = "Data Analytics Engineer case study. Ingestion layer (DuckDB + pandas + pyarrow)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Staff Analytics Engineer" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "dbt-core>=1.11",
    "dbt-duckdb>=1.10",
    "prefect>=3.0",
    "pytest>=8.0",
    "shandy-sqlfmt>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.sqlfmt]
exclude = ["target/**", "dbt_packages/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
